<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c16"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Isometric Slab Gradients -->
    <linearGradient id="slabTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="slabSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="slabTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="slabSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <linearGradient id="slabTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="slabSide3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#archBg)" rx="16"/>

  <!-- Title & Architecture Header -->
  <g transform="translate(480, 48)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">
      GEMVAULT DUAL-TIER AIR-GAPPED ARCHITECTURE
    </text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#a7f3d0" letter-spacing="1">
      Reactive In-Memory &amp; IndexedDB Client ⟷ Local FastAPI / SQLite WAL Synchronization
    </text>
  </g>

  <!-- ISOMETRIC LAYER 1: CLIENT PRESENTATION & 3D GRAPHICS (TOP) -->
  <!-- Top Center: 480, 140 -->
  <g transform="translate(0, 0)">
    <!-- Layer 1 Shadow -->
    <polygon points="480,185 760,250 480,315 200,250" fill="rgba(0,0,0,0.35)" filter="blur(6px)"/>

    <!-- Layer 1 Left Side -->
    <polygon points="200,230 480,295 480,315 200,250" fill="url(#slabSide1)"/>
    <!-- Layer 1 Right Side -->
    <polygon points="480,295 760,230 760,250 480,315" fill="#022c22"/>
    <!-- Layer 1 Top Face -->
    <polygon points="480,165 760,230 480,295 200,230" fill="url(#slabTop1)" stroke="#34d399" stroke-width="1.5" filter="url(#glowGreen)"/>

    <!-- Layer 1 Content / Badges -->
    <g transform="translate(480, 215)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
      <text font-size="16" font-weight="900" fill="#ffffff">TIER 1: HIGH-PERFORMANCE REACTIVE FRONTEND</text>
      <text y="20" font-size="12" font-weight="600" fill="#ecfdf5">React 19 • TypeScript 5.8 • Vite 8 • Custom 3D Gemstone Canvas Engine</text>
      <text y="38" font-size="11" font-weight="500" fill="#a7f3d0">Fixed-Point 0.001 Carat Math • Zero-Dependency QR Code Rasterizer • Printable Bills</text>
    </g>
  </g>

  <!-- ISOMETRIC CONNECTOR 1 -> 2 (Animated Pulsing Data Stream) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" opacity="0.8">
    <line x1="340" y1="270" x2="340" y2="330"/>
    <line x1="480" y1="305" x2="480" y2="365"/>
    <line x1="620" y1="270" x2="620" y2="330"/>
  </g>

  <!-- ISOMETRIC LAYER 2: SECURITY & RBAC PROTOCOL (MIDDLE) -->
  <g transform="translate(0, 95)">
    <!-- Layer 2 Shadow -->
    <polygon points="480,185 760,250 480,315 200,250" fill="rgba(0,0,0,0.3)" filter="blur(6px)"/>
    <!-- Layer 2 Left Side -->
    <polygon points="200,230 480,295 480,315 200,250" fill="url(#slabSide2)"/>
    <!-- Layer 2 Right Side -->
    <polygon points="480,295 760,230 760,250 480,315" fill="#082f49"/>
    <!-- Layer 2 Top Face -->
    <polygon points="480,165 760,230 480,295 200,230" fill="url(#slabTop2)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowBlue)"/>

    <!-- Layer 2 Content -->
    <g transform="translate(480, 215)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
      <text font-size="16" font-weight="900" fill="#ffffff">TIER 2: ZERO-TRUST RBAC &amp; CRYPTOGRAPHIC GATEWAY</text>
      <text y="20" font-size="12" font-weight="600" fill="#e0f2fe">Master PIN 2014 • PBKDF2 HMAC-SHA256 • Cost Price Masking Engine</text>
      <text y="38" font-size="11" font-weight="500" fill="#bae6fd">Sales Mode (Margins Masked) ⟷ Master Vault Mode (Wholesale Valuation Unlocked)</text>
    </g>
  </g>

  <!-- ISOMETRIC CONNECTOR 2 -> 3 -->
  <g stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" opacity="0.8">
    <line x1="340" y1="365" x2="340" y2="425"/>
    <line x1="480" y1="400" x2="480" y2="460"/>
    <line x1="620" y1="365" x2="620" y2="425"/>
  </g>

  <!-- ISOMETRIC LAYER 3: DUAL-TIER PERSISTENCE (BOTTOM) -->
  <g transform="translate(0, 190)">
    <!-- Layer 3 Shadow -->
    <polygon points="480,185 760,250 480,315 200,250" fill="rgba(0,0,0,0.4)" filter="blur(8px)"/>
    <!-- Layer 3 Left Side -->
    <polygon points="200,230 480,295 480,315 200,250" fill="url(#slabSide3)"/>
    <!-- Layer 3 Right Side -->
    <polygon points="480,295 760,230 760,250 480,315" fill="#2e1065"/>
    <!-- Layer 3 Top Face -->
    <polygon points="480,165 760,230 480,295 200,230" fill="url(#slabTop3)" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Layer 3 Content -->
    <g transform="translate(480, 215)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
      <text font-size="16" font-weight="900" fill="#ffffff">TIER 3: DUAL AIR-GAPPED PERSISTENCE</text>
      <text y="20" font-size="12" font-weight="600" fill="#f3e8ff">Local IndexedDB v5 (Web/Standalone) + SQLite WAL (FastAPI Python Daemon)</text>
      <text y="38" font-size="11" font-weight="500" fill="#e9d5ff">100% Offline Mirroring • AES-GCM Encrypted JSON Backups • Zero Cloud Telemetry</text>
    </g>
  </g>

</svg>
